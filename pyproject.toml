[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tellco_analytics"
version = "1.0.0"
description = "Telecommunication User Overview, Engagement, Experience, and Satisfaction Analytics Package"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "sqlalchemy",
    "streamlit",
    "pytest",
    "matplotlib",
    "seaborn"
]
